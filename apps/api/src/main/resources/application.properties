spring.application.name=webcoder-api
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/webcoder}
spring.datasource.username=${DB_USERNAME:webcoder}
spring.datasource.password=${DB_PASSWORD:webcoder_dev}
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
webcoder.redis-locks.enabled=${REDIS_LOCKS_ENABLED:false}
