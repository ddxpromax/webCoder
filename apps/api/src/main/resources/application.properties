spring.application.name=webcoder-api

server.port=8080

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

webcoder.ai.base-url=${AI_BASE_URL:http://127.0.0.1:8000}

spring.http.clients.imperative.factory=simple
spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=5s

spring.mvc.problemdetails.enabled=true

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/webcoder}
spring.datasource.username=${DB_USERNAME:webcoder}
spring.datasource.password=${DB_PASSWORD:webcoder_dev}

spring.flyway.enabled=true
