server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 500m;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Majo desktop clients load the web application from /console.  Vite
    # emits root-relative assets, but also accept prefixed asset URLs so a
    # deep-linked desktop WebView never receives index.html as JavaScript.
    location /console/assets/ {
        rewrite ^/console/(.*)$ /$1 break;
        try_files $uri =404;
    }

    location /console/ {
        try_files $uri $uri/ /index.html;
    }

    location = /console {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
