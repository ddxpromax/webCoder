name: webcoder

services:
  postgres:
    image: postgres:17.11
    restart: unless-stopped
    environment:
      POSTGRES_DB: webcoder
      POSTGRES_USER: webcoder
      POSTGRES_PASSWORD: webcoder_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data: