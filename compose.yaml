name: webcoder

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: webcoder_root_dev
      MYSQL_DATABASE: webcoder
      MYSQL_USER: webcoder
      MYSQL_PASSWORD: webcoder_dev
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysql -h 127.0.0.1 -u "$$MYSQL_USER" -p"$$MYSQL_PASSWORD" -D "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql_data: